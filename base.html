<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python Duo</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><nav><a class="brand" href="{{ url_for('dashboard') }}">🐍 Python Duo</a><span class="navright">{% if session.get('display_name') %}Hi, {{session.get('display_name')}} · <a href="{{url_for('logout')}}">Logout</a>{% endif %}</span></nav><main>{% with messages=get_flashed_messages() %}{% if messages %}<div class="flash">{{messages[0]}}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}</main><footer>Built for two Python learners · Keep practising together 🚀</footer></body></html>
